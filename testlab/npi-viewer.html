<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ClaudeChart — NPI detector — edit replays</title>

  <style>
    :root {
      --bg: #1e1e1e;
      --panel: #252526;
      --line: #333;
      --fg: #d4d4d4;
      --dim: #808080;
      --add: #4ec9b0;
      --del: #f14c4c;
      --active: #4fc1ff;
      --why: #dcdcaа;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
      background: var(--bg);
      color: var(--fg);
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 10px 14px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: baseline;
      gap: 12px;
    }

    header .brand {
      color: var(--active);
      font-weight: 700;
    }

    header .totals {
      margin-left: auto;
      color: var(--dim);
    }

    .add {
      color: var(--add);
    }

    .del {
      color: var(--del);
    }

    .dim {
      color: var(--dim);
    }

    /* Dashboard: one lane per session, side by side. */
    #lanes {
      flex: 1;
      display: flex;
      gap: 1px;
      overflow-x: auto;
      background: var(--line);
      min-height: 0;
    }

    .lane {
      flex: 1 0 340px;
      min-width: 300px;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }

    .lane-head {
      position: sticky;
      top: 0;
      z-index: 1;
      background: var(--panel);
      padding: 8px 12px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .lane-label {
      font-weight: 700;
      color: var(--active);
    }

    .ended-tag {
      font-size: 11px;
      color: var(--dim);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 0 6px;
    }

    .lane-totals {
      margin-left: auto;
      color: var(--dim);
      font-size: 12px;
    }

    .lane-tree {
      padding: 10px 12px;
    }

    .lane-why {
      padding: 10px 12px;
      border-top: 1px solid var(--line);
      background: var(--panel);
    }

    .lane-why .head {
      color: var(--active);
      margin-bottom: 8px;
    }

    .lane-why .rationale {
      color: var(--fg);
      margin-bottom: 12px;
    }

    .lane-why pre {
      margin: 0;
      white-space: pre-wrap;
      word-break: break-all;
    }

    .lane-why .b {
      color: var(--del);
    }

    .lane-why .a {
      color: var(--add);
    }

    .lane-why h2 {
      font-size: 11px;
      color: var(--why);
      margin: 0 0 6px;
      text-transform: uppercase;
      letter-spacing: .05em;
    }

    .node {
      margin: 1px 0;
    }

    .dir {
      color: var(--dim);
    }

    .file {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 3px 6px;
      border-radius: 4px;
      transition: background .3s ease;
    }

    .file .name {
      font-weight: 600;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .file .kind {
      color: var(--dim);
      font-size: 11px;
    }

    .file .blast {
      color: #d7ba7d;
      font-size: 11px;
      background: rgba(215, 186, 125, .12);
      padding: 0 6px;
      border-radius: 8px;
    }

    .file .counts {
      margin-left: auto;
      white-space: nowrap;
    }

    .bar {
      display: inline-flex;
      height: 8px;
      width: 120px;
      border-radius: 3px;
      overflow: hidden;
      background: #2a2a2a;
    }

    .bar .seg-add {
      background: var(--add);
      transition: width .5s ease;
    }

    .bar .seg-del {
      background: var(--del);
      transition: width .5s ease;
    }

    .file.pulse {
      background: rgba(79, 193, 255, .22);
      animation: pop .5s ease;
    }

    .file.pulse .name {
      color: var(--active);
    }

    @keyframes pop {
      0% {
        transform: scale(.98);
      }

      50% {
        transform: scale(1.02);
      }

      100% {
        transform: scale(1);
      }
    }

    #why h2 {
      font-size: 12px;
      color: var(--why);
      margin: 0 0 6px;
      text-transform: uppercase;
      letter-spacing: .05em;
    }

    #why .head {
      color: var(--active);
      margin-bottom: 8px;
    }

    #why .rationale {
      color: var(--fg);
      margin-bottom: 14px;
    }

    #why pre {
      margin: 0;
      white-space: pre-wrap;
      word-break: break-all;
    }

    #why .b {
      color: var(--del);
    }

    #why .a {
      color: var(--add);
    }

    .srow {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
      margin: 6px 0;
    }

    .slabel {
      color: var(--dim);
      font-size: 11px;
      min-width: 84px;
      text-transform: uppercase;
      letter-spacing: .04em;
    }

    .chip {
      background: #2d2d2d;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 1px 8px;
      font-size: 11px;
    }

    .chip.dep {
      border-color: #d7ba7d55;
      color: #d7ba7d;
    }

    .chip.add-chip {
      border-color: #4ec9b055;
      color: var(--add);
    }

    .chip.del-chip {
      border-color: #f14c4c55;
      color: var(--del);
    }

    .file.denied {
      opacity: .5;
    }

    .file.denied .name {
      text-decoration: line-through;
    }

    .gate {
      display: flex;
      gap: 8px;
      margin-top: 16px;
    }

    .gbtn {
      font: inherit;
      padding: 5px 14px;
      border-radius: 5px;
      border: 1px solid var(--line);
      cursor: pointer;
    }

    .gbtn.allow {
      background: #10362f;
      color: var(--add);
      border-color: #4ec9b055;
    }

    .gbtn.deny {
      background: #3a1f1f;
      color: var(--del);
      border-color: #f14c4c55;
    }

    .empty {
      color: var(--dim);
    }
  </style>
</head>

<body>
  <header>
    <span class="brand">ClaudeChart</span>
    <span class="dim">NPI detector • edit replay</span>
    <span class="totals" id="totals"></span>
  </header>

  <div id="lanes">
    <div class="empty">waiting for sessions…</div>
  </div>

  <!--
    Injected test feed.

    This was originally a single extremely long line in the source.
    Formatting it as normal JavaScript objects makes it much easier
    to edit while preserving the same data.
  -->
  <script>
    window.__CLAUDECHART_EVENTS__ = [
      {
        seq: 1,
        tool: "Write",
        kind: "create",
        filePath: "testlab/mask.ts",
        hunks: [
          {
            before: "",
            after:
              "// Mask a value so detector output never echoes raw non-public data.\n" +
              "export function mask(value: string): string {\n" +
              "  if (value.length <= 4) return \"***\";\n" +
              "  return value.slice(0, 2) + \"***\" + value.slice(-2);\n" +
              "}\n"
          }
        ],
        rationale:
          "Add a masking helper so detector output never echoes raw values.",
        structure: {
          imports: [],
          dependents: [],
          addedImports: [],
          removedImports: []
        },
        sessionId: "npi-detector"
      },

      {
        seq: 2,
        tool: "Edit",
        kind: "edit",
        filePath: "testlab/npi.ts",
        hunks: [
          {
            before:
              "export interface DataRecord {",
            after:
              "import { mask } from \"./mask.ts\";\n\n" +
              "export interface DataRecord {"
          }
        ],
        rationale:
          "Import the masking helper into the detector.",
        structure: {
          imports: [],
          dependents: ["testlab/pipeline.ts"],
          addedImports: ["testlab/mask.ts"],
          removedImports: []
        },
        sessionId: "npi-detector"
      },

      {
        seq: 3,
        tool: "MultiEdit",
        kind: "multi-edit",
        filePath: "testlab/npi.ts",
        hunks: [
          {
            before:
              "const EMAIL = /^[^\\s@]+@[^\\s@]+\\.[^\\s@]+/;",
            after:
              "const EMAIL = /^[^\\s@]+@[^\\s@]+\\.[^\\s@]+/;\n" +
              "const PHONE = /\\b\\d{3}[-.\\s]?\\d{3,4}\\b/;\n" +
              "const SSN_FORMAT = /\\b\\d{3}-\\d{2}-\\d{4}\\b/;\n" +
              "const SENSITIVE_FIELDS = new Set([\"ssn\", \"dob\", \"account\", \"accountNumber\"]);"
          },

          {
            before:
              "    if (typeof value !== \"string\") continue;\n" +
              "    if (EMAIL.test(value)) reasons.push(`email in \"${field}\"`);",
            after:
              "    if (SENSITIVE_FIELDS.has(field)) reasons.push(`sensitive field \"${field}\"`);\n" +
              "    if (typeof value !== \"string\") continue;\n" +
              "    if (EMAIL.test(value)) reasons.push(`email (${mask(value)}) in \"${field}\"`);\n" +
              "    if (PHONE.test(value)) reasons.push(`phone (${mask(value)}) in \"${field}\"`);\n" +
              "    if (SSN_FORMAT.test(value)) reasons.push(`ssn-format value in \"${field}\"`);"
          }
        ],
        rationale:
          "Broaden detection: phone numbers, SSN-format values, and known sensitive field names.",
        structure: {
          imports: ["testlab/mask.ts"],
          dependents: ["testlab/pipeline.ts"],
          addedImports: [],
          removedImports: []
        },
        sessionId: "npi-detector"
      },

      {
        seq: 4,
        tool: "Edit",
        kind: "edit",
        filePath: "testlab/npi.ts",
        hunks: [
          {
            before:
              "  return { id: rec.id, isNpi: reasons.length > 0, reasons };",
            after:
              "  const severity = reasons.some((r) => r.startsWith(\"sensitive\") || r.includes(\"ssn\"))\n" +
              "    ? \"high\"\n" +
              "    : reasons.length > 0\n" +
              "      ? \"low\"\n" +
              "      : \"none\";\n" +
              "  return { id: rec.id, isNpi: reasons.length > 0, severity, reasons };"
          }
        ],
        rationale:
          "Add a severity level so downstream can prioritize high-risk records.",
        structure: {
          imports: ["testlab/mask.ts"],
          dependents: ["testlab/pipeline.ts"],
          addedImports: [],
          removedImports: []
        },
        sessionId: "npi-detector"
      }
    ];
  </script>

  <script>
    /*
     * ClaudeChart webview renderer — multi-session dashboard.
     *
     * Consumes ChangeEvents (each tagged with sessionId) and renders one lane per
     * session: its file tree, blast-radius badges, latest rationale/diff, and — in
     * VS Code gated mode — per-lane Approve/Reject controls. Also handles two
     * control messages from the host: {type:"session-start"} and {type:"session-end"}.
     *
     * In VS Code, messages arrive via postMessage. Opened in a browser, it auto-plays
     * an injected feed (window.__CLAUDECHART_EVENTS__, which may interleave sessions).
     * Depends only on the wire format — not on the SDK or the event core.
     */
    (function () {
      "use strict";

      var inVsCode = typeof acquireVsCodeApi === "function";
      var vscode = inVsCode ? acquireVsCodeApi() : null;

      // sessionId -> { label, files:Map, last, pendingSeq, denied:Set, ended }
      var sessions = new Map();

      function getSession(id, label) {
        var s = sessions.get(id);

        if (!s) {
          s = {
            label: label || id,
            files: new Map(),
            last: null,
            pendingSeq: null,
            denied: new Set(),
            ended: false
          };

          sessions.set(id, s);
        } else if (label) {
          s.label = label;
        }

        return s;
      }

      function countLines(str) {
        if (!str) return 0;
        return str.replace(/\n$/, "").split("\n").length;
      }

      function applyEvent(ev) {
        var s = getSession(ev.sessionId || "default");
        var adds = 0;
        var dels = 0;

        (ev.hunks || []).forEach(function (h) {
          adds += countLines(h.after);
          dels += countLines(h.before);
        });

        var prev = s.files.get(ev.filePath) || {
          kind: ev.kind,
          adds: 0,
          dels: 0,
          seq: 0,
          dependents: 0
        };

        s.files.set(ev.filePath, {
          kind: ev.kind,
          adds: prev.adds + adds,
          dels: prev.dels + dels,
          seq: ev.seq,
          dependents:
            (ev.structure && ev.structure.dependents.length) ||
            prev.dependents
        });

        s.last = ev;
        s.pendingSeq = inVsCode && !s.ended ? ev.seq : null;

        render();

        pulse(
          s === sessions.get(ev.sessionId || "default")
            ? (ev.sessionId || "default")
            : null,
          ev.filePath
        );
      }

      function handleControl(msg) {
        if (msg.type === "session-start") {
          getSession(msg.sessionId, msg.label);
          render();
        } else if (msg.type === "session-end") {
          var s = sessions.get(msg.sessionId);

          if (s) {
            s.ended = true;
            s.pendingSeq = null;
          }

          render();
        }
      }

      // ── tree building (scoped to one session's file map) ───────────────
      function buildTree(files) {
        var root = {
          name: "",
          children: new Map()
        };

        Array.from(files.keys())
          .sort()
          .forEach(function (path) {
            var node = root;

            path.split("/").forEach(function (part, i, parts) {
              var child = node.children.get(part);

              if (!child) {
                child = {
                  name: part,
                  children: new Map()
                };

                node.children.set(part, child);
              }

              if (i === parts.length - 1) {
                child.path = path;
              }

              node = child;
            });
          });

        return root;
      }

      function fileRow(node, s, sessionId) {
        var fs = s.files.get(node.path);

        var row = document.createElement("div");
        row.className = "file";
        row.setAttribute("data-session", sessionId);
        row.setAttribute("data-path", node.path);

        if (s.denied.has(node.path)) {
          row.classList.add("denied");
        }

        var name = document.createElement("span");
        name.className = "name";
        name.textContent = node.name;

        var kind = document.createElement("span");
        kind.className = "kind";
        kind.textContent = fs.kind;

        var total = Math.max(fs.adds + fs.dels, 1);

        var bar = document.createElement("span");
        bar.className = "bar";

        var segA = document.createElement("span");
        segA.className = "seg-add";
        segA.style.width = (100 * fs.adds / total) + "%";

        var segD = document.createElement("span");
        segD.className = "seg-del";
        segD.style.width = (100 * fs.dels / total) + "%";

        bar.appendChild(segA);
        bar.appendChild(segD);

        var counts = document.createElement("span");
        counts.className = "counts";
        counts.innerHTML =
          '<span class="add">+' + fs.adds + '</span> ' +
          '<span class="del">−' + fs.dels + '</span>';

        row.appendChild(name);
        row.appendChild(kind);

        if (fs.dependents) {
          var blast = document.createElement("span");
          blast.className = "blast";
          blast.title = "dependents (blast radius)";
          blast.textContent = "↔" + fs.dependents;
          row.appendChild(blast);
        }

        row.appendChild(bar);
        row.appendChild(counts);

        return row;
      }

      function renderNode(node, depth, container, s, sessionId) {
        var kids = Array.from(node.children.values()).sort(function (a, b) {
          var ad = a.children.size ? 0 : 1;
          var bd = b.children.size ? 0 : 1;

          // dirs first
          return ad - bd || a.name.localeCompare(b.name);
        });

        kids.forEach(function (child) {
          var wrap = document.createElement("div");
          wrap.className = "node";
          wrap.style.paddingLeft = depth * 14 + "px";

          if (child.path) {
            wrap.appendChild(fileRow(child, s, sessionId));
          } else {
            var dir = document.createElement("div");
            dir.className = "dir";
            dir.textContent = child.name + "/";
            wrap.appendChild(dir);
          }

          container.appendChild(wrap);
          renderNode(child, depth + 1, container, s, sessionId);
        });
      }

      // ── rendering ──────────────────────────────────────────────────────
      function render() {
        var lanes = document.getElementById("lanes");
        lanes.innerHTML = "";

        var tAdds = 0;
        var tDels = 0;
        var tFiles = 0;

        sessions.forEach(function (s, id) {
          tFiles += s.files.size;

          var la = 0;
          var ld = 0;

          s.files.forEach(function (f) {
            la += f.adds;
            ld += f.dels;
          });

          tAdds += la;
          tDels += ld;

          var lane = document.createElement("div");
          lane.className = "lane" + (s.ended ? " ended" : "");
          lane.setAttribute("data-session", id);

          var head = document.createElement("div");
          head.className = "lane-head";

          head.innerHTML =
            '<span class="lane-label">' +
              escapeHtml(s.label) +
            '</span>' +
            (s.ended
              ? '<span class="ended-tag">ended</span>'
              : '') +
            '<span class="lane-totals">' +
              s.files.size +
              ' file(s) <span class="add">+' +
              la +
              '</span> <span class="del">−' +
              ld +
              '</span></span>';

          lane.appendChild(head);

          var tree = document.createElement("div");
          tree.className = "lane-tree";

          if (s.files.size) {
            renderNode(buildTree(s.files), 0, tree, s, id);
          } else {
            tree.innerHTML =
              '<span class="empty">no changes yet</span>';
          }

          lane.appendChild(tree);

          var why = document.createElement("div");
          why.className = "lane-why";

          renderWhyInto(why, s, id);
          lane.appendChild(why);

          lanes.appendChild(lane);
        });

        document.getElementById("totals").innerHTML =
          sessions.size +
          " session(s) · " +
          tFiles +
          ' file(s) <span class="add">+' +
          tAdds +
          '</span> <span class="del">−' +
          tDels +
          '</span>';
      }

      function renderWhyInto(el, s, sessionId) {
        if (!s.last) {
          el.innerHTML =
            '<span class="empty">the rationale for each change appears here.</span>';
          return;
        }

        var last = s.last;

        var h =
          (last.hunks && last.hunks[0]) ||
          {
            before: "",
            after: ""
          };

        var beforeLines = h.before
          ? h.before.replace(/\n$/, "").split("\n")
          : [];

        var afterLines = h.after
          ? h.after.replace(/\n$/, "").split("\n")
          : [];

        el.innerHTML =
          '<div class="head">#' +
          last.seq +
          " · " +
          last.kind +
          " · " +
          escapeHtml(last.filePath) +
          "</div>" +
          '<div class="rationale">' +
          escapeHtml(last.rationale || "") +
          "</div>" +
          "<pre>" +
          beforeLines
            .map(function (l) {
              return '<span class="b">− ' +
                escapeHtml(l) +
                "</span>";
            })
            .join("\n") +
          (beforeLines.length && afterLines.length ? "\n" : "") +
          afterLines
            .map(function (l) {
              return '<span class="a">+ ' +
                escapeHtml(l) +
                "</span>";
            })
            .join("\n") +
          "</pre>" +
          structureHtml(last.structure);

        if (vscode && s.pendingSeq === last.seq && !s.ended) {
          var controls = document.createElement("div");
          controls.className = "gate";

          controls.appendChild(
            mkBtn("Approve", "allow", sessionId)
          );

          controls.appendChild(
            mkBtn("Reject", "deny", sessionId)
          );

          el.appendChild(controls);
        }
      }

      function chips(label, items, cls) {
        if (!items || !items.length) return "";

        return (
          '<div class="srow">' +
            '<span class="slabel">' +
              label +
            "</span>" +
            items
              .map(function (i) {
                return (
                  '<span class="chip ' +
                  (cls || "") +
                  '">' +
                  escapeHtml(i) +
                  "</span>"
                );
              })
              .join("") +
          "</div>"
        );
      }

      function structureHtml(st) {
        if (!st) return "";

        var out =
          '<h2 style="margin-top:14px">structure</h2>';

        out +=
          '<div class="srow">' +
            '<span class="slabel">blast radius</span>' +
            '<span class="chip">' +
              (st.dependents.length || 0) +
              " dependent(s)" +
            "</span>" +
          "</div>";

        out += chips("dependents", st.dependents, "dep");
        out += chips("imports", st.imports, "");
        out += chips("+ edges", st.addedImports, "add-chip");
        out += chips("− edges", st.removedImports, "del-chip");

        return out;
      }

      function pulse(sessionId, path) {
        if (!sessionId) return;

        var el = document.querySelector(
          '.lane[data-session="' +
          cssEscape(sessionId) +
          '"] .file[data-path="' +
          cssEscape(path) +
          '"]'
        );

        if (!el) return;

        el.classList.add("pulse");

        setTimeout(function () {
          el.classList.remove("pulse");
        }, 600);
      }

      function decide(sessionId, behavior) {
        var s = sessions.get(sessionId);

        if (!vscode || !s || s.pendingSeq == null) {
          return;
        }

        vscode.postMessage({
          type: "decision",
          sessionId: sessionId,
          seq: s.pendingSeq,
          behavior: behavior,
          message:
            behavior === "deny"
              ? "rejected in ClaudeChart"
              : undefined
        });

        if (behavior === "deny" && s.last) {
          s.denied.add(s.last.filePath);
        }

        s.pendingSeq = null;

        render();
      }

      function mkBtn(label, behavior, sessionId) {
        var b = document.createElement("button");

        b.className = "gbtn " + behavior;
        b.textContent = label;

        b.addEventListener("click", function () {
          decide(sessionId, behavior);
        });

        return b;
      }

      function escapeHtml(str) {
        return String(str).replace(/[&<>"']/g, function (c) {
          return {
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#39;"
          }[c];
        });
      }

      function cssEscape(str) {
        return String(str).replace(/["\\]/g, "\\$&");
      }

      // VS Code: control messages + tagged ChangeEvents arrive via postMessage.
      window.addEventListener("message", function (e) {
        var m = e.data;

        if (!m) return;

        if (
          m.type === "session-start" ||
          m.type === "session-end"
        ) {
          handleControl(m);
          return;
        }

        if (m.filePath && Array.isArray(m.hunks)) {
          applyEvent(m);
        }
      });

      // Standalone browser: auto-play an injected feed
      // (may interleave sessions), else a builtin sample.
      if (!inVsCode) {
        var BUILTIN = [
          {
            seq: 1,
            sessionId: "demo",
            tool: "Write",
            kind: "create",
            filePath: "greeting.txt",
            hunks: [
              {
                before: "",
                after: "Hello from ClaudeChart!\n"
              }
            ],
            rationale: "Starting with a greeting file.",
            structure: {
              imports: [],
              dependents: [],
              addedImports: [],
              removedImports: []
            }
          }
        ];

        var feed =
          (
            window.__CLAUDECHART_EVENTS__ &&
            window.__CLAUDECHART_EVENTS__.length
          )
            ? window.__CLAUDECHART_EVENTS__
            : BUILTIN;

        var i = 0;

        (function step() {
          if (i < feed.length) {
            applyEvent(feed[i++]);
            setTimeout(step, 800);
          }
        })();
      }
    })();
  </script>
</body>
</html>
